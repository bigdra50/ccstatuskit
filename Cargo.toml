[package]
name = "ccstatuskit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A modular, starship-inspired statusline kit for Claude Code"
repository = "https://github.com/bigdra50/ccstatuskit"
license = "MIT OR Apache-2.0"
keywords = ["claude-code", "statusline", "cli"]
categories = ["command-line-utilities"]

[features]
default = ["scoped-usage"]
# Per-model quota fetch from the unofficial OAuth usage endpoint.
scoped-usage = ["dep:ureq"]

[dependencies]
anstyle = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
