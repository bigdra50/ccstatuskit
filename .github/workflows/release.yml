name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ccstatuskit
          target: ${{ matrix.target }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  packaging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate checksums and package manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          cd dist
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'ccstatuskit-*.tar.gz' \
            --pattern 'ccstatuskit-*.zip'

          sha256sum ccstatuskit-*.tar.gz ccstatuskit-*.zip | sort -k 2 > SHA256SUMS

          osx_arm64_sha=$(sha256sum ccstatuskit-aarch64-apple-darwin.tar.gz | cut -d ' ' -f 1)
          osx_x64_sha=$(sha256sum ccstatuskit-x86_64-apple-darwin.tar.gz | cut -d ' ' -f 1)
          linux_x64_sha=$(sha256sum ccstatuskit-x86_64-unknown-linux-gnu.tar.gz | cut -d ' ' -f 1)
          win_x64_sha=$(sha256sum ccstatuskit-x86_64-pc-windows-msvc.zip | cut -d ' ' -f 1)

          sed \
            -e "s/__VERSION__/$VERSION/g" \
            -e "s/__OSX_ARM64_SHA256__/$osx_arm64_sha/g" \
            -e "s/__OSX_X64_SHA256__/$osx_x64_sha/g" \
            -e "s/__LINUX_X64_SHA256__/$linux_x64_sha/g" \
            "$GITHUB_WORKSPACE/packaging/ccstatuskit.rb" > ccstatuskit.rb
          sed \
            -e "s/__VERSION__/$VERSION/g" \
            -e "s/__WIN_X64_SHA256__/$win_x64_sha/g" \
            "$GITHUB_WORKSPACE/packaging/ccstatuskit.json" > ccstatuskit.json

          ruby -c ccstatuskit.rb
          jq . ccstatuskit.json >/dev/null
          if grep -Eq '__[A-Z0-9_]+__' ccstatuskit.rb ccstatuskit.json; then
            echo "::error::Unresolved packaging placeholder"
            exit 1
          fi

          {
            echo "### Release assets"
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packaging assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/SHA256SUMS \
            dist/ccstatuskit.rb \
            dist/ccstatuskit.json \
            --clobber

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ -z "${HOMEBREW_TAP_DEPLOY_KEY}" ]]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY secret is not set; skipping Homebrew tap update."
            exit 0
          fi
          VERSION="${TAG#v}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "${HOMEBREW_TAP_DEPLOY_KEY}" > "$HOME/.ssh/tap_deploy_key"
          chmod 600 "$HOME/.ssh/tap_deploy_key"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git clone --depth 1 git@github.com:bigdra50/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp dist/ccstatuskit.rb tap/Formula/ccstatuskit.rb
          cd tap
          if git diff --quiet -- Formula/ccstatuskit.rb; then
            echo "Formula already up to date for ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ccstatuskit.rb
          git commit -m "ccstatuskit ${VERSION}"
          git push
